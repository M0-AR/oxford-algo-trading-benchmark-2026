services:
  research:
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - MPLBACKEND=Agg
    command: python -m src.experiments.run_benchmark --symbols SPY,QQQ,BTC-USD --start 2015-01-01 --output /app/results/benchmark.json

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./notebooks:/app/notebooks
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
